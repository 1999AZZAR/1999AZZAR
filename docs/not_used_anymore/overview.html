<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Showcase - 1999AZZAR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      background: linear-gradient(45deg, #ff6b6b, #ffd93d);
      border-radius: 50%;
      opacity: 0.1;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0px); }
      50% { transform: translateX(-50%) translateY(-20px); }
    }

    .title {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #f0f0f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .subtitle {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.9);
      font-weight: 300;
      margin-bottom: 2rem;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stat-item {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 1rem 2rem;
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
    }

    .stat-item:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.2);
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      display: block;
    }

    .stat-label {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      color: rgba(255,255,255,0.8);
      font-size: 1.1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .site-card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .site-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #4ecdc4, #45b7d1);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .site-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    .site-preview {
      position: relative;
      height: 220px;
      overflow: hidden;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .site-card iframe {
      width: 125%;
      height: 125%;
      border: none;
      transition: transform 0.3s ease;
      transform: scale(0.8);
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }

    .site-card:hover iframe {
      transform: scale(0.82);
    }

    .preview-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.05);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .site-card:hover .preview-overlay {
      opacity: 1;
    }

    .preview-icon {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #667eea;
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }

    .site-card:hover .preview-icon {
      transform: scale(1);
    }

    .card-content {
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-title::before {
      content: '🚀';
      font-size: 1rem;
    }

    .card-description {
      color: #718096;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .card-actions {
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: rgba(0,0,0,0.05);
      color: #4a5568;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .btn-secondary:hover {
      background: rgba(0,0,0,0.1);
      transform: translateY(-1px);
    }

    .error-message {
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 1.1rem;
      padding: 2rem;
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      margin: 2rem 0;
    }

    .toggle-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
    }

    .toggle-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .toggle-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .toggle-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.2);
    }

    .toggle-btn.active:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .repo-preview {
      position: relative;
      height: 220px;
      overflow: hidden;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .opengraph-preview {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .opengraph-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #667eea;
      text-align: center;
      padding: 2rem;
    }

    .opengraph-fallback i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.7;
    }

    .opengraph-fallback .repo-name {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .opengraph-fallback .repo-desc {
      font-size: 0.9rem;
      opacity: 0.8;
      line-height: 1.4;
    }

    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .shape {
      position: absolute;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: floatShapes 20s infinite linear;
    }

    @keyframes floatShapes {
      0% { transform: translateY(100vh) rotate(0deg); }
      100% { transform: translateY(-100px) rotate(360deg); }
    }

    .shape:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; }
    .shape:nth-child(2) { left: 20%; width: 60px; height: 60px; animation-delay: 2s; }
    .shape:nth-child(3) { left: 30%; width: 100px; height: 100px; animation-delay: 4s; }
    .shape:nth-child(4) { left: 40%; width: 40px; height: 40px; animation-delay: 6s; }
    .shape:nth-child(5) { left: 50%; width: 70px; height: 70px; animation-delay: 8s; }
    .shape:nth-child(6) { left: 60%; width: 90px; height: 90px; animation-delay: 10s; }
    .shape:nth-child(7) { left: 70%; width: 50px; height: 50px; animation-delay: 12s; }
    .shape:nth-child(8) { left: 80%; width: 120px; height: 120px; animation-delay: 14s; }
    .shape:nth-child(9) { left: 90%; width: 60px; height: 60px; animation-delay: 16s; }

    @media (max-width: 768px) {
      .title {
        font-size: 2.5rem;
      }
      
      .projects-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .stats {
        gap: 1rem;
      }
      
      .stat-item {
        padding: 0.8rem 1.5rem;
      }
      
      .container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="container">
    <div class="header">
      <h1 class="title">Portfolio Showcase</h1>
      <p class="subtitle">Exploring the digital frontier, one project at a time</p>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="total-repos">-</span>
          <span class="stat-label">Total Repos</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="deployed-sites">-</span>
          <span class="stat-label">Live Sites</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="languages-used">-</span>
          <span class="stat-label">Languages</span>
        </div>
      </div>
      
      <div class="toggle-buttons">
        <button class="toggle-btn active" id="web-btn">🌐 Live Sites</button>
        <button class="toggle-btn" id="repo-btn">📂 All Repositories</button>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>Loading amazing projects...</span>
    </div>

    <div id="error" class="error-message" style="display: none;">
      <h3>Oops! Something went wrong</h3>
      <p>Unable to fetch repositories. Please check your internet connection and try again.</p>
    </div>

    <div id="projects-grid" class="projects-grid"></div>
  </div>

  <script>
    const USERNAME = '1999AZZAR';
    const API_BASE = 'https://api.github.com';
    let allRepos = [];
    let currentView = 'web'; // 'web' or 'repos'

    async function fetchAllRepos() {
      const repos = [];
      let page = 1;
      let hasMore = true;

      try {
        while (hasMore) {
          if (page > 1) {
            await new Promise(resolve => setTimeout(resolve, 1000));
          }

          const response = await fetch(`${API_BASE}/users/${USERNAME}/repos?per_page=100&page=${page}&sort=updated&direction=desc`, {
            headers: {
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'Portfolio-Showcase'
            }
          });
          
          if (response.status === 403) {
            console.warn('Rate limited or forbidden. Using available repos.');
            break;
          }
          
          if (!response.ok) {
            if (page === 1) {
              throw new Error(`HTTP error! status: ${response.status}`);
            } else {
              console.warn(`Failed to fetch page ${page}, using available repos`);
              break;
            }
          }
          
          const pageRepos = await response.json();
          
          if (pageRepos.length === 0) {
            hasMore = false;
          } else {
            repos.push(...pageRepos);
            page++;
          }
          
          if (page > 10) break;
        }
        
        return repos;
      } catch (error) {
        console.error('Error fetching repositories:', error);
        if (repos.length > 0) {
          console.log(`Returning ${repos.length} repos despite error`);
          return repos;
        }
        throw error;
      }
    }

    async function fetchUserStats() {
      try {
        const response = await fetch(`${API_BASE}/users/${USERNAME}`, {
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'User-Agent': 'Portfolio-Showcase'
          }
        });
        
        if (response.status === 403) {
          console.warn('Rate limited for user stats');
          return null;
        }
        
        if (!response.ok) {
          console.warn('Failed to fetch user stats');
          return null;
        }
        
        return await response.json();
      } catch (error) {
        console.error('Error fetching user stats:', error);
        return null;
      }
    }

    function updateStats(repos, userStats) {
      const totalRepos = repos.length;
      const deployedSites = repos.filter(repo => 
        repo.homepage && 
        repo.homepage.startsWith('http') && 
        !repo.archived &&
        !repo.name.includes('.wiki')
      ).length;
      const languages = new Set(repos.map(repo => repo.language).filter(lang => lang)).size;

      document.getElementById('total-repos').textContent = totalRepos;
      document.getElementById('deployed-sites').textContent = deployedSites;
      document.getElementById('languages-used').textContent = languages;
    }

    function createWebSiteCard(repo) {
      const card = document.createElement('div');
      card.className = 'site-card';
      
      const description = repo.description || 'No description available';
      const truncatedDescription = description.length > 100 ? 
        description.substring(0, 100) + '...' : description;

      card.innerHTML = `
        <div class="site-preview">
          <iframe src="${repo.homepage}" loading="lazy" sandbox="allow-same-origin allow-scripts"></iframe>
          <div class="preview-overlay">
            <div class="preview-icon">🔗</div>
          </div>
        </div>
        <div class="card-content">
          <h3 class="card-title">${repo.name}</h3>
          <p class="card-description">${truncatedDescription}</p>
          <div class="card-actions">
            <a href="${repo.homepage}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
              🚀 Visit Site
            </a>
            <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
              📁 View Code
            </a>
          </div>
        </div>
      `;

      return card;
    }

    function createRepoCard(repo) {
      const card = document.createElement('div');
      card.className = 'site-card';
      
      const description = repo.description || 'No description available';
      const truncatedDescription = description.length > 100 ? 
        description.substring(0, 100) + '...' : description;

      const languageColor = getLanguageColor(repo.language);
      const repoIcon = getRepoIcon(repo);

      card.innerHTML = `
        <div class="repo-preview">
          <div class="opengraph-fallback">
            <i class="fab ${repoIcon}"></i>
            <div class="repo-name">${repo.name}</div>
            <div class="repo-desc">${truncatedDescription}</div>
          </div>
        </div>
        <div class="card-content">
          <h3 class="card-title">${repo.name}</h3>
          <p class="card-description">${truncatedDescription}</p>
          <div style="margin: 0.5rem 0; display: flex; align-items: center; gap: 1rem; font-size: 0.9rem; color: #718096;">
            ${repo.language ? `
              <span style="display: flex; align-items: center; gap: 0.3rem;">
                <span style="width: 12px; height: 12px; border-radius: 50%; background: ${languageColor};"></span>
                ${repo.language}
              </span>
            ` : ''}
            <span>⭐ ${repo.stargazers_count}</span>
            <span>🍴 ${repo.forks_count}</span>
          </div>
          <div class="card-actions">
            <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
              📁 View Repository
            </a>
            ${repo.homepage && repo.homepage.startsWith('http') ? `
              <a href="${repo.homepage}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                🔗 Live Demo
              </a>
            ` : ''}
          </div>
        </div>
      `;

      return card;
    }

    function getLanguageColor(language) {
      const colors = {
        'JavaScript': '#f1e05a',
        'Python': '#3572A5',
        'HTML': '#e34c26',
        'CSS': '#563d7c',
        'TypeScript': '#2b7489',
        'Java': '#b07219',
        'C++': '#f34b7d',
        'C': '#555555',
        'C#': '#239120',
        'PHP': '#4F5D95',
        'Ruby': '#701516',
        'Go': '#00ADD8',
        'Rust': '#dea584',
        'Swift': '#ffac45',
        'Kotlin': '#F18E33',
        'Dart': '#00B4AB',
        'Shell': '#89e051',
        'Vue': '#2c3e50',
        'Arduino': '#bd79d1'
      };
      return colors[language] || '#586069';
    }

    function getRepoIcon(repo) {
      const name = repo.name.toLowerCase();
      const language = repo.language ? repo.language.toLowerCase() : '';
      
      if (language.includes('python')) return 'fa-python';
      if (language.includes('javascript') || language.includes('typescript')) return 'fa-js-square';
      if (language.includes('html') || language.includes('css')) return 'fa-html5';
      if (language.includes('java')) return 'fa-java';
      if (language.includes('php')) return 'fa-php';
      if (language.includes('vue')) return 'fa-vuejs';
      if (language.includes('arduino') || name.includes('iot') || name.includes('esp')) return 'fa-microchip';
      if (name.includes('web') || name.includes('site')) return 'fa-globe';
      if (name.includes('bot') || name.includes('ai')) return 'fa-robot';
      if (name.includes('api')) return 'fa-cog';
      if (name.includes('mobile') || name.includes('app')) return 'fa-mobile-alt';
      return 'fa-folder';
    }

    function renderProjects(repos, type) {
      const grid = document.getElementById('projects-grid');
      grid.innerHTML = '';

      if (repos.length === 0) {
        grid.innerHTML = `
          <div class="error-message">
            <h3>No ${type} found</h3>
            <p>It looks like there are no ${type} available yet.</p>
          </div>
        `;
        return;
      }

      repos.forEach((repo, index) => {
        const card = type === 'web sites' ? createWebSiteCard(repo) : createRepoCard(repo);
        
        setTimeout(() => {
          card.style.opacity = '0';
          card.style.transform = 'translateY(20px)';
          grid.appendChild(card);
          
          requestAnimationFrame(() => {
            card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          });
        }, index * 100);
      });
    }

    function switchView(view) {
      currentView = view;
      const webBtn = document.getElementById('web-btn');
      const repoBtn = document.getElementById('repo-btn');
      
      webBtn.classList.toggle('active', view === 'web');
      repoBtn.classList.toggle('active', view === 'repos');

      if (view === 'web') {
        const sitesWithHomepage = allRepos.filter(repo => 
          repo.homepage && 
          repo.homepage.startsWith('http') && 
          !repo.archived &&
          !repo.name.includes('.wiki')
        );
        renderProjects(sitesWithHomepage, 'web sites');
      } else {
        const filteredRepos = allRepos.filter(repo => !repo.archived);
        renderProjects(filteredRepos, 'repositories');
      }
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }

    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    async function loadPortfolio() {
      try {
        const [repos, userStats] = await Promise.all([
          fetchAllRepos(),
          fetchUserStats()
        ]);

        allRepos = repos;
        updateStats(repos, userStats);
        hideLoading();

        // Start with web view
        switchView('web');

      } catch (error) {
        console.error('Error loading portfolio:', error);
        showError();
      }
    }

    // Event listeners
    document.getElementById('web-btn').addEventListener('click', () => switchView('web'));
    document.getElementById('repo-btn').addEventListener('click', () => switchView('repos'));

    // Initialize
    loadPortfolio();

    // Interactive mouse effects
    document.addEventListener('mousemove', (e) => {
      const shapes = document.querySelectorAll('.shape');
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      
      shapes.forEach((shape, index) => {
        const speed = (index + 1) * 0.5;
        const xOffset = (x - 0.5) * speed;
        const yOffset = (y - 0.5) * speed;
        
        shape.style.transform += ` translate(${xOffset}px, ${yOffset}px)`;
      });
    });
  </script>
</body>
</html>
